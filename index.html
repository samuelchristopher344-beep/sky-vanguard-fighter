<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sky Vanguard — Multiplayer Fighter Jet Combat</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');
    *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
    body{overflow:hidden;background:#05080f;font-family:'Rajdhani',system-ui,sans-serif;color:#e8f0ff;touch-action:none}
    canvas{display:block;position:fixed;inset:0}
    #startScreen{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 15%,#152038 0%,#05080f 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity .5s}
    #startScreen.hidden{opacity:0;pointer-events:none}
    .logo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(2rem,7vw,3.8rem);letter-spacing:.14em;background:linear-gradient(180deg,#ffd700,#b8860b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.15rem}
    .subtitle{font-family:'Orbitron',sans-serif;font-size:.85rem;letter-spacing:.4em;color:#6a8ab0;margin-bottom:1.8rem;text-transform:uppercase}
    .panel{background:rgba(10,18,36,.8);border:1px solid rgba(90,150,255,.28);border-radius:14px;padding:1.6rem 2rem;backdrop-filter:blur(14px);max-width:400px;width:92%;box-shadow:0 16px 50px rgba(0,0,0,.5)}
    .field{margin-bottom:1rem}
    .field label{display:block;font-size:.72rem;letter-spacing:.14em;color:#6a90b8;margin-bottom:.35rem;text-transform:uppercase}
    .field input,.field select{width:100%;background:rgba(0,0,0,.4);border:1px solid rgba(90,150,255,.3);border-radius:8px;padding:.65rem .9rem;color:#e8f0ff;font-family:inherit;font-size:1rem;outline:none}
    .field input:focus,.field select:focus{border-color:#4a9eff}
    .btn-row{display:flex;gap:.6rem;margin-top:.4rem}
    .btn-primary{flex:1;padding:.85rem;background:linear-gradient(180deg,#e8c547,#b8941f);border:none;border-radius:9px;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.9rem;letter-spacing:.12em;color:#1a1400;cursor:pointer;transition:transform .12s,box-shadow .12s;box-shadow:0 4px 18px rgba(232,197,71,.3)}
    .btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(232,197,71,.45)}
    .btn-secondary{flex:1;padding:.85rem;background:rgba(40,80,140,.4);border:1px solid rgba(100,160,255,.4);border-radius:9px;font-family:'Orbitron',sans-serif;font-weight:600;font-size:.85rem;letter-spacing:.1em;color:#c8e0ff;cursor:pointer}
    .status{margin-top:.9rem;font-size:.8rem;color:#7a9cc4;text-align:center;min-height:1.2em}
    .controls-hint{margin-top:1.3rem;font-size:.75rem;color:#5a7a9a;text-align:center;line-height:1.55}
    .controls-hint kbd{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:3px;padding:1px 5px;font-family:monospace;color:#a0c4e8;font-size:.7rem}
    #hud{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:0;transition:opacity .35s;font-family:'Orbitron',monospace;color:#7dffb3;text-shadow:0 0 6px rgba(0,255,140,.4)}
    #hud.visible{opacity:1}

    #hudTopBar{position:absolute;top:12px;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:0 20px;font-size:13px;letter-spacing:1px}
    .hudLeft,.hudRight{display:flex;flex-direction:column;gap:4px;min-width:140px}
    .hudRight{text-align:right}
    #headingTape{flex:1;display:flex;justify-content:center;max-width:440px;margin:0 12px}
    #headingCanvas{width:100%;height:36px}

    #centerReticle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:180px;height:180px;pointer-events:none}
    #reticleCircle{position:absolute;inset:20px;border:1.5px solid rgba(0,255,160,.75);border-radius:50%;box-shadow:0 0 12px rgba(0,255,140,.25)}
    #reticleCross{position:absolute;top:50%;left:50%;width:28px;height:28px;transform:translate(-50%,-50%)}
    #reticleCross::before,#reticleCross::after{content:'';position:absolute;background:rgba(0,255,160,.85)}
    #reticleCross::before{width:2px;height:100%;left:50%;transform:translateX(-50%)}
    #reticleCross::after{height:2px;width:100%;top:50%;transform:translateY(-50%)}
    #targetInfo{position:absolute;bottom:-28px;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap;color:#ff6b6b;text-align:center}
    #centerReticle.locked #reticleCircle{border-color:#ff4444;box-shadow:0 0 16px rgba(255,60,40,.45)}
    #centerReticle.locked #reticleCross::before,#centerReticle.locked #reticleCross::after{background:#ff5555}

    #weaponsPanel{position:absolute;left:18px;top:110px;font-size:13px;line-height:1.7;letter-spacing:1px}
    #weaponsPanel .modeTag{margin-top:8px;color:#ffcc44;font-size:12px}
    #lockRow{color:#7dffb3}
    #lockRow.locked{color:#ff5555;animation:pulse .6s infinite alternate}

    #radarPanel{position:absolute;right:16px;bottom:70px;width:140px;height:140px;background:rgba(0,12,8,.65);border:1px solid rgba(0,220,140,.35);border-radius:4px;overflow:hidden}
    #radarCanvas{width:100%;height:100%}
    .rwrLabel{position:absolute;top:4px;left:6px;font-size:10px;color:rgba(0,255,160,.6);letter-spacing:1px}

    #hudBottom{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;font-size:12px;letter-spacing:1px}
    #viewLabel{opacity:.7}

    #healthBar{position:absolute;bottom:48px;left:50%;transform:translateX(-50%);width:min(220px,50vw);height:6px;background:rgba(0,0,0,.45);border:1px solid rgba(255,70,70,.35);border-radius:3px;overflow:hidden}
    #healthFill{height:100%;width:100%;background:linear-gradient(90deg,#c02020,#e05030);transition:width .18s}

    @keyframes pulse{from{opacity:.65}to{opacity:1}}
    #playerList{position:absolute;top:100px;left:18px;font-size:12px;line-height:1.5;display:none}
    #playerList.visible{display:block}
    #playerList .pl{color:#9ecfff}
    #playerList .pl.me{color:#ffd700}
    #mobileControls{position:fixed;inset:0;pointer-events:none;z-index:40;display:none}
    @media(max-width:900px),(pointer:coarse){#mobileControls{display:block}}
    .m-btn{position:absolute;width:54px;height:54px;background:rgba(15,35,70,.55);border:1px solid rgba(90,150,255,.4);border-radius:50%;color:#c0d8ff;font-size:1.2rem;display:flex;align-items:center;justify-content:center;pointer-events:auto;backdrop-filter:blur(5px);touch-action:none}
    .m-btn:active{background:rgba(50,110,200,.55)}
    #btnPitchUp{bottom:150px;left:84px}#btnPitchDown{bottom:84px;left:84px}
    #btnRollLeft{bottom:117px;left:20px}#btnRollRight{bottom:117px;left:148px}
    #btnThrottle{bottom:117px;right:20px;width:66px;border-radius:11px;font-size:.7rem;font-family:Orbitron}
    #btnFire{bottom:190px;right:20px;background:rgba(160,30,30,.45);border-color:rgba(255,70,70,.5)}
    #btnMissile{bottom:255px;right:20px;background:rgba(160,90,15,.4);border-color:rgba(255,150,40,.5);font-size:.65rem;font-family:Orbitron}
    #btnView{top:72px;right:18px;font-size:.7rem;font-family:Orbitron;width:60px;border-radius:9px}
    #gameOver{position:fixed;inset:0;background:rgba(3,7,16,.9);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:90;backdrop-filter:blur(10px)}
    #gameOver h2{font-family:'Orbitron',sans-serif;font-size:2.1rem;letter-spacing:.14em;color:#ff4848;margin-bottom:.7rem}
    #gameOver .score-line{font-size:1.25rem;color:#e8c547;margin-bottom:1.6rem}
    #gameOver button{padding:.8rem 2rem;background:linear-gradient(180deg,#e8c547,#b8941f);border:none;border-radius:9px;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.9rem;letter-spacing:.1em;color:#1a1400;cursor:pointer}
    #waveBanner{position:fixed;top:28%;left:50%;transform:translateX(-50%);font-family:'Orbitron',sans-serif;font-size:1.6rem;letter-spacing:.18em;color:#ffd700;text-shadow:0 0 18px rgba(255,200,0,.55);opacity:0;transition:opacity .35s;z-index:60;pointer-events:none}
    #playerList{position:absolute;top:70px;left:18px;background:rgba(6,12,24,.7);border:1px solid rgba(70,130,210,.3);border-radius:8px;padding:8px 12px;font-size:.75rem;max-width:160px;display:none}
    #playerList.visible{display:block}
    #playerList .pl{margin:3px 0;color:#a0c4e8}
    #playerList .pl.me{color:#ffd700}
  </style>
</head>
<body>
  <div id="startScreen">
    <div class="logo">SKY VANGUARD</div>
    <div class="subtitle">Multiplayer Jet Combat</div>
    <div class="panel">
      <div class="field">
        <label>Callsign</label>
        <input id="callsignInput" type="text" maxlength="14" value="Viper" />
      </div>
      <div class="field">
        <label>Room Code</label>
        <input id="roomInput" type="text" maxlength="12" value="WAR1" placeholder="e.g. WAR1" />
      </div>
      <div class="field">
        <label>Mode</label>
        <select id="modeSelect">
          <option value="solo">Solo vs AI</option>
          <option value="multi">Multiplayer (WebSocket)</option>
        </select>
      </div>
      <div class="btn-row">
        <button class="btn-primary" id="startBtn">TAKEOFF</button>
      </div>
      <div class="status" id="status">Ready</div>
      <div class="controls-hint">
        <kbd>W</kbd><kbd>S</kbd> Pitch &nbsp; <kbd>A</kbd><kbd>D</kbd> Roll &nbsp; <kbd>Q</kbd><kbd>E</kbd> Yaw<br>
        <kbd>Shift</kbd> Afterburner &nbsp; <kbd>Space</kbd> Gun &nbsp; <kbd>F</kbd> Missile &nbsp; <kbd>C</kbd> View
      </div>
    </div>
  </div>

  <div id="hud">
    <!-- Top bar: ALT / SPD / Heading tape / Score / Time -->
    <div id="hudTopBar">
      <div class="hudLeft">
        <div>ALT <span id="altVal">18500</span> FT</div>
        <div>SPD <span id="spdVal">480</span> KT</div>
        <div>G <span id="gVal">1.0</span></div>
      </div>
      <div id="headingTape">
        <canvas id="headingCanvas" width="420" height="36"></canvas>
      </div>
      <div class="hudRight">
        <div>SCORE <span id="scoreVal">0</span></div>
        <div id="lockStatusTop">NO LOCK</div>
      </div>
    </div>

    <!-- Center targeting reticle -->
    <div id="centerReticle">
      <div id="reticleCircle"></div>
      <div id="reticleCross"></div>
      <div id="targetInfo">
        <span id="tgtRange">--</span>
        <span id="tgtLabel"></span>
      </div>
    </div>

    <!-- Left weapons panel -->
    <div id="weaponsPanel">
      <div>GUN <span id="gunAmmo">∞</span></div>
      <div>MSL <span id="mslCount">6</span></div>
      <div id="lockRow">NO LOCK</div>
      <div class="modeTag">A/A</div>
    </div>

    <!-- Right radar + RWR style -->
    <div id="radarPanel">
      <canvas id="radarCanvas" width="140" height="140"></canvas>
      <div class="rwrLabel">RWR</div>
    </div>

    <!-- Bottom status -->
    <div id="hudBottom">
      <div>FUEL <span id="fuelVal">8200</span> LB</div>
      <div id="viewLabel">EXT</div>
      <div>HP <span id="hpVal">100</span>%</div>
    </div>

    <div id="healthBar"><div id="healthFill"></div></div>
    <div id="playerList"></div>
  </div>

  <div id="waveBanner">WAVE 1</div>

  <div id="mobileControls">
    <div class="m-btn" id="btnPitchUp">↑</div>
    <div class="m-btn" id="btnPitchDown">↓</div>
    <div class="m-btn" id="btnRollLeft">←</div>
    <div class="m-btn" id="btnRollRight">→</div>
    <div class="m-btn" id="btnThrottle">AB</div>
    <div class="m-btn" id="btnFire">●</div>
    <div class="m-btn" id="btnMissile">MSL</div>
    <div class="m-btn" id="btnView">VIEW</div>
  </div>

  <div id="gameOver">
    <h2>MISSION FAILED</h2>
    <div class="score-line">Score: <span id="finalScore">0</span></div>
    <button id="restartBtn">RETURN TO BASE</button>
  </div>

  <script type="module">
  import * as THREE from 'three';

  // ========== IMPROVED FLIGHT MODEL ==========
  // Velocity-based with approximate lift, drag, stall, energy management
  const FLT = {
    mass: 1,
    wingArea: 1.2,
    maxThrust: 28,          // stronger acceleration
    abThrust: 48,           // punchy afterburner
    dragCoeff: 0.014,
    liftCoeff: 0.145,
    stallAngle: 0.40,
    gravity: 9.81 * 0.022,
    maxSpeed: 34,           // higher top speed
    abMaxSpeed: 44,
    takeoffSpeed: 9.5       // need this speed to lift off
  };

  let gameRunning = false;
  let playerHealth = 100;
  let score = 0;
  let wave = 0;
  let missilesLeft = 6;
  let callsign = 'Viper';
  let mode = 'solo';
  let viewMode = 0;
  let lockedTarget = null;
  let afterburner = false;
  let throttle = 0.7;
  let aoa = 0; // angle of attack

  const keys = {};
  const bullets = [];
  const missiles = [];
  const enemies = [];
  const particles = [];
  const remotePlayers = new Map(); // id -> {mesh, data}
  let myId = null;
  let ws = null;
  let roomCode = 'WAR1';

  // ========== THREE SETUP ==========
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x7eb6e0);
  scene.fog = new THREE.FogExp2(0x7eb6e0, 0.00016);

  const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.4, 28000);
  const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  document.body.appendChild(renderer.domElement);

  const sun = new THREE.DirectionalLight(0xfff2d8, 1.55);
  sun.position.set(700, 1100, 350);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.near = 80; sun.shadow.camera.far = 3500;
  sun.shadow.camera.left = sun.shadow.camera.bottom = -1400;
  sun.shadow.camera.right = sun.shadow.camera.top = 1400;
  scene.add(sun);
  scene.add(new THREE.AmbientLight(0x3a4a68, 0.42));
  scene.add(new THREE.HemisphereLight(0x87ceeb, 0x3a5a2a, 0.5));

  // Terrain
  function createTerrain() {
    const size=22000, segs=56;
    const geo = new THREE.PlaneGeometry(size, size, segs, segs);
    const pos = geo.attributes.position;
    for (let i=0;i<pos.count;i++){
      const x=pos.getX(i), z=pos.getY(i);
      let h = Math.sin(x*0.0005)*110 + Math.cos(z*0.00065)*85;
      h += Math.sin(x*0.0016+z*0.0011)*35;
      h += (Math.random()-0.5)*14;
      pos.setZ(i, Math.max(h, -15));
    }
    geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color:0x3a683a, roughness:0.92, metalness:0.04, flatShading:true}));
    mesh.rotation.x = -Math.PI/2;
    mesh.receiveShadow = true;
    return mesh;
  }
  scene.add(createTerrain());

  // ========== RUNWAY + AIRBASE ==========
  const runwayGroup = new THREE.Group();

  // Main runway surface
  const runwayMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2e, roughness: 0.85, metalness: 0.1 });
  const runway = new THREE.Mesh(new THREE.BoxGeometry(1800, 2, 55), runwayMat);
  runway.position.set(0, 12, 0);
  runway.receiveShadow = true;
  runwayGroup.add(runway);

  // Runway center line
  const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  for (let i = -8; i <= 8; i++) {
    const line = new THREE.Mesh(new THREE.BoxGeometry(45, 0.5, 1.8), lineMat);
    line.position.set(i * 95, 13.2, 0);
    runwayGroup.add(line);
  }

  // Edge lines
  const edgeMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
  const edgeL = new THREE.Mesh(new THREE.BoxGeometry(1800, 0.4, 1.2), edgeMat);
  edgeL.position.set(0, 13.1, 26);
  runwayGroup.add(edgeL);
  const edgeR = edgeL.clone();
  edgeR.position.z = -26;
  runwayGroup.add(edgeR);

  // Threshold markings
  for (let i = 0; i < 6; i++) {
    const mark = new THREE.Mesh(new THREE.BoxGeometry(18, 0.4, 3.5), lineMat);
    mark.position.set(-820, 13.2, -15 + i * 6);
    runwayGroup.add(mark);
    const mark2 = mark.clone();
    mark2.position.x = 820;
    runwayGroup.add(mark2);
  }

  // Taxiway
  const taxi = new THREE.Mesh(new THREE.BoxGeometry(80, 1.5, 220), runwayMat);
  taxi.position.set(-200, 11.5, 140);
  runwayGroup.add(taxi);

  // Simple hangar / control tower
  const hangarMat = new THREE.MeshStandardMaterial({ color: 0x4a5560, metalness: 0.4, roughness: 0.6 });
  const hangar = new THREE.Mesh(new THREE.BoxGeometry(90, 28, 60), hangarMat);
  hangar.position.set(-280, 25, 180);
  hangar.castShadow = true;
  runwayGroup.add(hangar);

  const tower = new THREE.Mesh(new THREE.BoxGeometry(18, 55, 18), hangarMat);
  tower.position.set(120, 38, 160);
  tower.castShadow = true;
  runwayGroup.add(tower);
  const towerTop = new THREE.Mesh(new THREE.BoxGeometry(28, 10, 28), new THREE.MeshStandardMaterial({ color: 0x3a4550, metalness: 0.5, roughness: 0.4 }));
  towerTop.position.set(120, 70, 160);
  runwayGroup.add(towerTop);

  // Approach lights
  const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  for (let i = 1; i <= 8; i++) {
    const light = new THREE.Mesh(new THREE.BoxGeometry(3, 1.5, 3), lightMat);
    light.position.set(-900 - i * 40, 14, 0);
    runwayGroup.add(light);
  }

  scene.add(runwayGroup);

  // Clouds
  const cloudGroup = new THREE.Group();
  const cloudMat = new THREE.MeshStandardMaterial({color:0xffffff, transparent:true, opacity:0.5, roughness:1});
  for(let i=0;i<36;i++){
    const c = new THREE.Mesh(new THREE.SphereGeometry(70+Math.random()*110,6,6), cloudMat);
    c.position.set((Math.random()-0.5)*16000, 1600+Math.random()*1100, (Math.random()-0.5)*16000);
    c.scale.set(1+Math.random(), 0.35+Math.random()*0.25, 1+Math.random());
    cloudGroup.add(c);
  }
  scene.add(cloudGroup);

  // ========== JET ==========
  function createJet(color=0x4a5568, accent=0x2d3748, isPlayer=false) {
    const jet = new THREE.Group();

    // Higher quality materials
    const metal = new THREE.MeshStandardMaterial({
      color, metalness: 0.85, roughness: 0.22, envMapIntensity: 1.2
    });
    const dark = new THREE.MeshStandardMaterial({
      color: accent, metalness: 0.7, roughness: 0.35
    });
    const glass = new THREE.MeshPhysicalMaterial({
      color: 0x081828, transparent: true, opacity: 0.55,
      metalness: 0.1, roughness: 0.05, transmission: 0.35,
      thickness: 0.4, ior: 1.45
    });
    const abMat = new THREE.MeshBasicMaterial({ color: 0xff4400 });
    const abCore = new THREE.MeshBasicMaterial({ color: 0xffcc66 });
    const tireMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9, metalness: 0.1 });
    const missileMat = new THREE.MeshStandardMaterial({ color: 0xc8c8c8, metalness: 0.75, roughness: 0.3 });

    // === FUSELAGE (more detailed) ===
    const fuse = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.72, 10.8, 16), metal);
    fuse.rotation.z = Math.PI / 2;
    fuse.castShadow = true;
    jet.add(fuse);

    // Nose cone
    const nose = new THREE.Mesh(new THREE.ConeGeometry(0.38, 2.8, 14), metal);
    nose.rotation.z = -Math.PI / 2;
    nose.position.x = 6.85;
    jet.add(nose);

    // Nose tip (radar)
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), dark);
    tip.position.x = 8.3;
    jet.add(tip);

    // === COCKPIT ===
    const canopy = new THREE.Mesh(
      new THREE.SphereGeometry(0.72, 14, 10, 0, Math.PI * 2, 0, Math.PI * 0.55),
      glass
    );
    canopy.position.set(2.15, 0.58, 0);
    canopy.scale.set(1.35, 0.95, 0.82);
    jet.add(canopy);

    // Canopy frame
    const frame = new THREE.Mesh(
      new THREE.TorusGeometry(0.55, 0.04, 6, 16, Math.PI),
      dark
    );
    frame.rotation.y = Math.PI / 2;
    frame.position.set(2.15, 0.55, 0);
    frame.scale.set(1.1, 0.9, 1);
    jet.add(frame);

    // === MAIN WINGS (swept, more realistic) ===
    const wingShape = new THREE.Shape();
    wingShape.moveTo(0, 0);
    wingShape.lineTo(-2.8, 5.4);
    wingShape.lineTo(-1.2, 5.7);
    wingShape.lineTo(1.8, 0.5);
    wingShape.lineTo(0.6, 0);
    wingShape.lineTo(0, 0);
    const wingGeo = new THREE.ExtrudeGeometry(wingShape, {
      depth: 0.14, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.02, bevelSegments: 2
    });

    const wingL = new THREE.Mesh(wingGeo, metal);
    wingL.rotation.x = Math.PI / 2;
    wingL.rotation.z = Math.PI / 2;
    wingL.position.set(-0.3, 0.02, 0.12);
    wingL.castShadow = true;
    jet.add(wingL);

    const wingR = wingL.clone();
    wingR.scale.z = -1;
    wingR.position.z = -0.12;
    jet.add(wingR);

    // Wing tips
    const tipL = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.08, 0.35), dark);

  // ========== AUDIO ==========
  let audioCtx=null, engOsc=null, engGain=null;
  function initAudio(){
    if(audioCtx) return;
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    engOsc = audioCtx.createOscillator();
    engGain = audioCtx.createGain();
    const filt = audioCtx.createBiquadFilter();
    filt.type='lowpass'; filt.frequency.value=380;
    engOsc.type='sawtooth'; engOsc.frequency.value=80;
    engGain.gain.value=0;
    engOsc.connect(filt); filt.connect(engGain); engGain.connect(audioCtx.destination);
    engOsc.start();
  }
  function updateEngine(spd, ab){
    if(!engGain) return;
    engOsc.frequency.setTargetAtTime(70+spd*0.32+(ab?35:0), audioCtx.currentTime, 0.07);
    engGain.gain.setTargetAtTime(Math.min(0.11+spd*0.00035,0.2)*(ab?1.25:1), audioCtx.currentTime, 0.09);
  }
  function beep(f,d,t='square',v=0.07){
    if(!audioCtx) return;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=t; o.frequency.value=f;
    g.gain.setValueAtTime(v,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+d);
  }
  function sfxGun(){beep(170+Math.random()*50,0.05,'square',0.055)}
  function sfxMsl(){beep(85,0.22,'sawtooth',0.09);beep(200,0.12,'square',0.04)}
  function sfxBoom(){beep(55,0.35,'sawtooth',0.13);beep(35,0.45,'triangle',0.09)}
  function sfxLock(){beep(900,0.07,'sine',0.055)}

  // ========== MULTIPLAYER ==========
  function connectWS(){
    const WS_URL = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
      ? 'ws://localhost:8080'
      : 'wss://YOUR-MULTIPLAYER-SERVER.example.com';

    try {
      ws = new WebSocket(WS_URL);
      ws.onopen = () => {
        document.getElementById('status').textContent = 'Connected to multiplayer';
        ws.send(JSON.stringify({type:'join', room:roomCode, name:callsign, id:myId}));
      };
      ws.onmessage = (ev) => {
        try {
          const msg = JSON.parse(ev.data);
          handleNetMsg(msg);
        } catch(e){}
      };
      ws.onclose = () => {
        document.getElementById('status').textContent = 'Disconnected – switch to Solo or restart server';
      };
      ws.onerror = () => {
        document.getElementById('status').textContent = 'Cannot reach multiplayer server – use Solo mode';
      };
    } catch(e){
      document.getElementById('status').textContent = 'WebSocket failed – use Solo mode';
    }
  }

  function handleNetMsg(msg){
    if(msg.type==='state' && msg.players){
      const seen = new Set();
      msg.players.forEach(p=>{
        if(p.id===myId) return;
        seen.add(p.id);
        let r = remotePlayers.get(p.id);
        if(!r){
          const mesh = createJet(0x6a3a3a, 0x4a2020, false);
          mesh.userData.id = p.id;
          mesh.userData.name = p.name;
          scene.add(mesh);
          r = {mesh, data:p};
          remotePlayers.set(p.id, r);
        }
        r.mesh.position.set(p.x, p.y, p.z);
        r.mesh.quaternion.set(p.qx, p.qy, p.qz, p.qw);
        r.data = p;
      });
      for(const [id,r] of remotePlayers){
        if(!seen.has(id)){scene.remove(r.mesh); remotePlayers.delete(id)}
      }
      updatePlayerList();
    }
  }

  function sendState(){

      id: myId,
      name: callsign,
      x: player.position.x, y: player.position.y, z: player.position.z,
      qx: q.x, qy: q.y, qz: q.z, qw: q.w,
      health: playerHealth,

    }));
  }

    e.position.set(

  function spawnWave(){
    if (mode === 'multi') return;

    wave++;
    const n = Math.min(2 + Math.floor(wave * 1.35), 10);

      setTimeout(() => spawnEnemy(true), i * 320);

    b.style.opacity = '1';
    setTimeout(() => b.style.opacity = '0', 2000);

  function fireGun(){
    if(!gameRunning) return;
    sfxGun();
    const dir = new THREE.Vector3(1,0,0).applyQuaternion(player.quaternion);
    for(let i=-1;i<=1;i+=2){
      const b=new THREE.Mesh(new THREE.SphereGeometry(0.2,5,5), new THREE.MeshBasicMaterial({color:0xffee55}));
      const off=new THREE.Vector3(0,0,i*1.05).applyQuaternion(player.quaternion);
      b.position.copy(player.position).add(dir.clone().multiplyScalar(6.5)).add(off);
      b.userData={vel:dir.clone().multiplyScalar(16), life:50, owner:'player'};
      scene.add(b); bullets.push(b);
    }
  }
  function fireMissile(){
    if(!gameRunning||missilesLeft<=0) return;
    missilesLeft--; updateHud(); sfxMsl();
    const m=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.2,2.4,6), new THREE.MeshStandardMaterial({color:0xdddddd,metalness:0.7}));
    m.rotation.z=Math.PI/2;

    m.position.copy(player.position).add(dir.clone().multiplyScalar(6.5));

    scene.add(m); missiles.push(m);

  // ========== HUD ==========
  function updateHud(){
    const alt = Math.round(player.position.y * 3.28);
    const spd = Math.round(player.userData.vel.length() * 42);
    const gApprox = (1 + Math.abs(aoa) * 2.2).toFixed(1);

    document.getElementById('altVal').textContent = alt;
    document.getElementById('spdVal').textContent = spd;
    document.getElementById('gVal').textContent = gApprox;
    document.getElementById('scoreVal').textContent = score;
    document.getElementById('mslCount').textContent = missilesLeft;
    document.getElementById('hpVal').textContent = Math.max(0, Math.round(playerHealth));
    document.getElementById('healthFill').style.width = Math.max(0, playerHealth) + '%';
    document.getElementById('fuelVal').textContent = Math.max(0, 8200 - Math.floor(score * 0.8));

    const viewNames = ['EXT', 'CHASE', 'COCKPIT'];
    document.getElementById('viewLabel').textContent = viewNames[viewMode] || 'EXT';

    const lockEl = document.getElementById('lockRow');
    const lockTop = document.getElementById('lockStatusTop');
    const reticle = document.getElementById('centerReticle');
    const tgtRange = document.getElementById('tgtRange');
    const tgtLabel = document.getElementById('tgtLabel');

    if (lockedTarget && lockedTarget.parent) {
      lockEl.textContent = 'LOCK ON';
      lockEl.classList.add('locked');
      lockTop.textContent = 'LOCK';
      lockTop.style.color = '#ff5555';
      reticle.classList.add('locked');
      const dist = lockedTarget.position.distanceTo(player.position);
      tgtRange.textContent = (dist / 185.2).toFixed(1) + ' NM';
      tgtLabel.textContent = 'TGT';
    } else {
      lockEl.textContent = 'NO LOCK';
      lockEl.classList.remove('locked');
      lockTop.textContent = 'NO LOCK';
      lockTop.style.color = '';
      reticle.classList.remove('locked');
      tgtRange.textContent = '--';
      tgtLabel.textContent = '';
      lockedTarget = null;
    }

    drawHeadingTape();
  }

  function drawHeadingTape() {
    const canvas = document.getElementById('headingCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    const look = new THREE.Vector3(1, 0, 0).applyQuaternion(player.quaternion);
    let hdg = (Math.atan2(look.z, look.x) * 180 / Math.PI + 360) % 360;

    ctx.fillStyle = 'rgba(0,20,12,0.55)';
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(0,255,160,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, h-1); ctx.lineTo(w, h-1); ctx.stroke();

    ctx.fillStyle = '#7dffb3';
    ctx.font = '11px Orbitron, monospace';
    ctx.textAlign = 'center';

    const center = w / 2;
    const pxPerDeg = 2.8;

    for (let d = -60; d <= 60; d += 5) {
      let deg = (hdg + d + 360) % 360;
      const x = center + d * pxPerDeg;
      if (x < 8 || x > w - 8) continue;
      const major = d % 10 === 0;
      ctx.beginPath();
      ctx.moveTo(x, h - 1);
      ctx.lineTo(x, h - (major ? 12 : 7));
      ctx.stroke();
      if (major) {
        const label = Math.round(deg).toString().padStart(3, '0');
        ctx.fillText(label, x, 14);
      }
    }

    ctx.fillStyle = '#ffcc44';
    ctx.beginPath();
    ctx.moveTo(center, h - 2);
    ctx.lineTo(center - 6, h - 14);
    ctx.lineTo(center + 6, h - 14);
    ctx.closePath();
    ctx.fill();
  }

  function drawRadar() {
    const canvas = document.getElementById('radarCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const s = 140;
    ctx.clearRect(0, 0, s, s);

    ctx.fillStyle = 'rgba(0,15,10,0.7)';
    ctx.fillRect(0, 0, s, s);

    ctx.strokeStyle = 'rgba(0,220,140,0.2)';
    ctx.lineWidth = 1;
    for (let r = 20; r <= 60; r += 20) {
      ctx.beginPath(); ctx.arc(s/2, s/2, r, 0, Math.PI*2); ctx.stroke();
    }

    ctx.beginPath();
    ctx.moveTo(s/2, 8); ctx.lineTo(s/2, s-8);
    ctx.moveTo(8, s/2); ctx.lineTo(s-8, s/2);
    ctx.stroke();

    ctx.fillStyle = '#7dffb3';
    ctx.beginPath(); ctx.arc(s/2, s/2, 3.5, 0, Math.PI*2); ctx.fill();

    const look = new THREE.Vector3(1, 0, 0).applyQuaternion(player.quaternion);
    const hdg = Math.atan2(look.z, look.x);
    ctx.strokeStyle = 'rgba(0,255,160,0.55)';
    ctx.beginPath();
    ctx.moveTo(s/2, s/2);
    ctx.lineTo(s/2 + Math.sin(hdg) * 28, s/2 - Math.cos(hdg) * 28);
    ctx.stroke();

    const range = 2400;
    enemies.forEach(e => {
      const dx = e.position.x - player.position.x;
      const dz = e.position.z - player.position.z;
      const dist = Math.hypot(dx, dz);
      if (dist > range) return;
      ctx.fillStyle = lockedTarget === e ? '#ff4444' : '#ff8844';
      ctx.beginPath();
      ctx.arc(s/2 + (dx/range)*55, s/2 + (dz/range)*55, lockedTarget === e ? 4 : 3, 0, Math.PI*2);
      ctx.fill();
    });

    remotePlayers.forEach(r => {
      const dx = r.mesh.position.x - player.position.x;
      const dz = r.mesh.position.z - player.position.z;
      const dist = Math.hypot(dx, dz);
      if (dist > range) return;
      ctx.fillStyle = '#44aaff';
      ctx.beginPath();
      ctx.arc(s/2 + (dx/range)*55, s/2 + (dz/range)*55, 3, 0, Math.PI*2);
      ctx.fill();
    });
  }

  // ========== INPUT ==========
  addEventListener('keydown',e=>{
    keys[e.code]=true;
    if(e.code==='KeyC') viewMode=(viewMode+1)%3;
    if(e.code==='KeyF') fireMissile();
    if(e.code==='KeyR') cycleLock();
  });
  addEventListener('keyup',e=>keys[e.code]=false);

  const mob={pitchU:0,pitchD:0,rollL:0,rollR:0,ab:0,fire:0};
  function bindM(id,down,up){
    const el=document.getElementById(id); if(!el) return;
    const s=e=>{e.preventDefault();down()}; const en=e=>{e.preventDefault();up&&up()};
    el.addEventListener('touchstart',s,{passive:false}); el.addEventListener('touchend',en);
    el.addEventListener('mousedown',s); el.addEventListener('mouseup',en); el.addEventListener('mouseleave',en);
  }
  bindM('btnPitchUp',()=>mob.pitchU=1,()=>mob.pitchU=0);
  bindM('btnPitchDown',()=>mob.pitchD=1,()=>mob.pitchD=0);
  bindM('btnRollLeft',()=>mob.rollL=1,()=>mob.rollL=0);
  bindM('btnRollRight',()=>mob.rollR=1,()=>mob.rollR=0);
  bindM('btnThrottle',()=>{mob.ab=1;afterburner=true},()=>{mob.ab=0;afterburner=false});
  bindM('btnFire',()=>mob.fire=1,()=>mob.fire=0);
  bindM('btnMissile',()=>fireMissile());
  bindM('btnView',()=>viewMode=(viewMode+1)%3);

  function cycleLock(){
    const all=[...enemies, ...[...remotePlayers.values()].map(r=>r.mesh)];
    if(!all.length){lockedTarget=null;return}
    const idx=lockedTarget?all.indexOf(lockedTarget):-1;
    lockedTarget=all[(idx+1)%all.length];
    sfxLock();
  }

  // ========== IMPROVED FLIGHT UPDATE ==========
  let lastGun=0;
  let onGround = true;

  function updatePlayer(dt){
    const pitchIn = (keys['KeyS']||keys['ArrowDown']||mob.pitchD?1:0) - (keys['KeyW']||keys['ArrowUp']||mob.pitchU?1:0);
    const rollIn  = (keys['KeyA']||keys['ArrowLeft']||mob.rollL?1:0) - (keys['KeyD']||keys['ArrowRight']||mob.rollR?1:0);
    const yawIn   = (keys['KeyQ']?1:0) - (keys['KeyE']?1:0);
    afterburner = keys['ShiftLeft']||keys['ShiftRight']||mob.ab;

    const spd = player.userData.vel.length();
    const ctrlScale = onGround
      ? THREE.MathUtils.clamp(spd / 6, 0.15, 0.6)
      : THREE.MathUtils.clamp(spd / 9, 0.55, 1.45);

    player.rotateZ(rollIn * 2.4 * ctrlScale * dt);
    player.rotateY(yawIn * 1.35 * ctrlScale * dt);
    player.rotateX(pitchIn * 1.7 * ctrlScale * dt);

    const tgtThrot = afterburner ? 1.0 : (keys['KeyX'] ? 0.25 : 0.78);
    throttle += (tgtThrot - throttle) * 3.5 * dt;

    const forward = new THREE.Vector3(1,0,0).applyQuaternion(player.quaternion);
    const up = new THREE.Vector3(0,1,0).applyQuaternion(player.quaternion);

    const thrust = (afterburner ? FLT.abThrust : FLT.maxThrust) * throttle;
    const thrustVec = forward.clone().multiplyScalar(thrust * dt);

    const velDir = spd > 0.1 ? player.userData.vel.clone().normalize() : forward.clone();
    aoa = Math.acos(THREE.MathUtils.clamp(forward.dot(velDir), -1, 1));

    let liftMag = 0;
    if (spd > 3) {
      const cl = FLT.liftCoeff * Math.sin(aoa * 2.1);
      liftMag = cl * spd * spd * 0.018;
      if (aoa > FLT.stallAngle) liftMag *= 0.3;
    }
    const liftVec = up.clone().multiplyScalar(liftMag * dt);

    const dragMag = FLT.dragCoeff * spd * spd * (1 + aoa * 1.6);
    const dragVec = spd > 0.1
      ? player.userData.vel.clone().normalize().multiplyScalar(-dragMag * dt)
      : new THREE.Vector3();

    const grav = new THREE.Vector3(0, -FLT.gravity * dt, 0);

    if (onGround) {
      player.userData.vel.multiplyScalar(1 - 1.8 * dt);
      const euler = new THREE.Euler().setFromQuaternion(player.quaternion, 'YXZ');
      euler.x *= 0.9;
      euler.z *= 0.85;
      player.quaternion.setFromEuler(euler);
    }

    player.userData.vel.add(thrustVec).add(liftVec).add(dragVec).add(grav);

    const maxSpd = afterburner ? FLT.abMaxSpeed : FLT.maxSpeed;
    if (player.userData.vel.length() > maxSpd) player.userData.vel.setLength(maxSpd);

    player.position.add(player.userData.vel.clone().multiplyScalar(dt * 55));

    const abOn = afterburner && throttle > 0.85;
    if (player.userData.abMesh) player.userData.abMesh.visible = abOn;
    if (player.userData.abInner) player.userData.abInner.visible = abOn;
    if (abOn && Math.random() < 0.45) {
      const trail = player.position.clone().add(new THREE.Vector3(-6.2, 0, 0).applyQuaternion(player.quaternion));
      spawnFX(trail, 0xff4422, 3, 1.5);
    }

    const groundY = 22;
    if (player.position.y <= groundY + 0.5) {
      if (spd < FLT.takeoffSpeed) {
        onGround = true;
        player.position.y = groundY;
        player.userData.vel.y = Math.max(0, player.userData.vel.y);
      } else {
        onGround = false;
      }
    } else {
      onGround = false;
    }

    if (player.position.y < groundY - 1) {
      player.position.y = groundY;
      player.userData.vel.y = Math.abs(player.userData.vel.y) * 0.25;
      if (spd > 8) damagePlayer(22);
    }

    if(!lockedTarget || !lockedTarget.parent){
      let best=null, bestD=0.6;
      const look=new THREE.Vector3(1,0,0).applyQuaternion(player.quaternion);
      [...enemies, ...[...remotePlayers.values()].map(r=>r.mesh)].forEach(t=>{
        const to=t.position.clone().sub(player.position).normalize();
        const d=look.dot(to);
        if(d>bestD){bestD=d;best=t}
      });
      if(best){lockedTarget=best;sfxLock()}
    }

    if((keys['Space']||mob.fire) && performance.now()-lastGun>85){fireGun();lastGun=performance.now()}
    updateEngine(spd*42, afterburner);
  }

  function updateEnemies(dt){
    if (mode === 'multi') {
      enemies.forEach(e => {
        if (!e.parent) return;
        const fwd = new THREE.Vector3(1,0,0).applyQuaternion(e.quaternion);
        e.position.add(fwd.multiplyScalar(3 * dt * 50));
      });
      return;
    }

    enemies.forEach(e => {
      if (!e.parent) return;

      e.userData.cooldown -= dt * 60;
      e.userData.missileCooldown -= dt * 60;
      e.userData.stateTimer -= dt;

      const toPlayer = player.position.clone().sub(e.position);
      const dist = toPlayer.length();
      const toPlayerDir = toPlayer.clone().normalize();
      const fwd = new THREE.Vector3(1,0,0).applyQuaternion(e.quaternion);
      const skill = e.userData.skill;
      const agg = e.userData.aggressiveness;

      if (e.userData.stateTimer <= 0) {
        if (e.userData.state === 'engage' && dist < 380) {
          e.userData.state = 'break';
          e.userData.stateTimer = 1.8 + Math.random() * 1.4;
        } else if (e.userData.state === 'break' && dist > 900) {
          e.userData.state = 'reengage';
          e.userData.stateTimer = 1.2 + Math.random();
        } else if (e.userData.state === 'reengage') {
          e.userData.state = 'engage';
          e.userData.stateTimer = 3 + Math.random() * 2;
        } else if (e.userData.state === 'engage' && dist > 2200) {
          e.userData.state = 'reengage';
        }
      }

      let desired = toPlayerDir.clone();

      if (e.userData.state === 'break') {
        const side = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,1,0)).normalize();
        if (Math.random() > 0.5) side.negate();
        desired = side.multiplyScalar(0.75)
          .add(new THREE.Vector3(0, (Math.random() > 0.4 ? 0.6 : -0.4), 0))
          .add(toPlayerDir.clone().multiplyScalar(-0.3))
          .normalize();
      } else if (e.userData.state === 'reengage') {
        const offset = new THREE.Vector3(
          (Math.random() - 0.5) * 1.2,
          (Math.random() - 0.5) * 0.6,
          (Math.random() - 0.5) * 1.2
        );
        desired = toPlayerDir.clone().add(offset).normalize();
      } else {
        const lead = player.userData.vel.clone().multiplyScalar(0.35 * skill);
        desired = player.position.clone().add(lead).sub(e.position).normalize();

        if (dist > 700 && dist < 1400 && Math.random() < 0.008) {
          desired.y += (Math.random() > 0.5 ? 0.7 : -0.5);
          desired.normalize();
        }
      }

      const turnRate = 0.035 + skill * 0.045 + agg * 0.02;
      fwd.lerp(desired, turnRate);
      fwd.normalize();

      e.lookAt(e.position.clone().add(fwd));
      e.rotateY(-Math.PI / 2);

      let speed = 4.8 + skill * 1.6;
      if (e.userData.state === 'break') speed *= 0.85;
      if (e.userData.state === 'reengage') speed *= 1.15;
      e.position.add(fwd.multiplyScalar(speed * dt * 50));

      if (e.position.y < 160) e.position.y += 2.2;
      if (e.position.y > 2100) e.position.y -= 1.8;
      if (e.position.y < e.userData.preferredAlt - 200) e.position.y += 0.8;
      if (e.position.y > e.userData.preferredAlt + 300) e.position.y -= 0.6;

      const facing = fwd.dot(toPlayerDir);

      if (facing > 0.78 && dist < 1100 && dist > 120) {
        if (e.userData.cooldown <= 0) {
          enemyFire(e);
          e.userData.cooldown = 28 + Math.random() * 25 - skill * 12;
        }
      }

      if (wave >= 2 && e.userData.missileCooldown <= 0 && facing > 0.82 && dist < 1600 && dist > 400) {
        enemyFireMissile(e);
        e.userData.missileCooldown = 220 + Math.random() * 180 - skill * 40;
      }
    });
  }

  function enemyFireMissile(e) {
    const m = new THREE.Mesh(
      new THREE.CylinderGeometry(0.12, 0.18, 2.1, 6),
      new THREE.MeshStandardMaterial({ color: 0xdd4422, metalness: 0.6 })
    );
    m.rotation.z = Math.PI / 2;
    const dir = new THREE.Vector3(1, 0, 0).applyQuaternion(e.quaternion);
    m.position.copy(e.position).add(dir.clone().multiplyScalar(5.5));
    m.userData = {
      vel: dir.clone().multiplyScalar(3.2),
      target: player,
      life: 280,
      owner: 'enemy'
    };
    scene.add(m);
    missiles.push(m);
    spawnFX(m.position, 0xff5522, 4, 2);
  }

  function updateProjectiles(dt){
    for(let i=bullets.length-1;i>=0;i--){
      const b=bullets[i];
      b.position.add(b.userData.vel.clone().multiplyScalar(dt*52));
      b.userData.life-=dt*60;
      if(b.userData.life<=0){scene.remove(b);bullets.splice(i,1);continue}
      if(b.userData.owner==='enemy' && b.position.distanceTo(player.position)<4.2){
        damagePlayer(7); scene.remove(b); bullets.splice(i,1); spawnFX(b.position,0xff3333,5,2.5); continue;
      }
      if(b.userData.owner==='player'){
        for(let j=enemies.length-1;j>=0;j--){
          if(b.position.distanceTo(enemies[j].position)<4.8){
            enemies[j].userData.health-=11;
            scene.remove(b); bullets.splice(i,1); spawnFX(b.position,0xffee55,4,2);
            if(enemies[j].userData.health<=0) destroyEnemy(enemies[j]);
            break;
          }
        }
      }
    }
    for(let i=missiles.length-1;i>=0;i--){
      const m=missiles[i];
      if(m.userData.target && m.userData.target.parent){
        const to = m.userData.target.position.clone().sub(m.position).normalize();
        m.userData.vel.lerp(to.multiplyScalar(5.8), 0.085);
        m.lookAt(m.position.clone().add(m.userData.vel));
        m.rotateY(-Math.PI/2);
      }
      m.position.add(m.userData.vel.clone().multiplyScalar(dt*52));
      m.userData.life -= dt*60;
      if(m.userData.life <= 0){ scene.remove(m); missiles.splice(i,1); continue; }

      if (m.userData.owner === 'player') {
        for (let j = enemies.length-1; j >= 0; j--) {
          if (m.position.distanceTo(enemies[j].position) < 7.5) {
            boom(enemies[j].position);
            destroyEnemy(enemies[j]);
            scene.remove(m);
            missiles.splice(i,1);
            break;
          }
        }
      }
      else if (m.userData.owner === 'enemy') {
        if (m.position.distanceTo(player.position) < 6.5) {
          boom(player.position.clone());
          damagePlayer(28);
          scene.remove(m);
          missiles.splice(i,1);
        }
      }
    }
  }

  function updateParticles(dt){
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.position.add(p.userData.vel.clone().multiplyScalar(dt*48));
      p.userData.vel.multiplyScalar(0.95);
      p.userData.life-=dt*60;
      p.material.opacity=Math.max(0,p.userData.life/35);
      if(p.userData.life<=0){scene.remove(p);particles.splice(i,1)}
    }
  }

  function destroyEnemy(e){
    boom(e.position); scene.remove(e);
    const idx=enemies.indexOf(e); if(idx>=0) enemies.splice(idx,1);
    score+=140+wave*30;
    if(lockedTarget===e) lockedTarget=null;
    updateHud();
    if(enemies.length===0 && gameRunning && mode==='solo') setTimeout(spawnWave,2600);
  }
  function damagePlayer(amt){
    if(!gameRunning) return;
    playerHealth-=amt; updateHud();
    if(playerHealth<=0) endGame();
  }
  function endGame(){
    gameRunning=false;
    document.getElementById('finalScore').textContent=score;
    document.getElementById('gameOver').style.display='flex';
    document.getElementById('hud').classList.remove('visible');
    if(engGain) engGain.gain.setTargetAtTime(0,audioCtx.currentTime,0.25);
    if(ws) ws.close();
  }

  function updateCamera(){
    const fwd=new THREE.Vector3(1,0,0).applyQuaternion(player.quaternion);
    const up=new THREE.Vector3(0,1,0).applyQuaternion(player.quaternion);

    if (typeof cockpitGroup !== 'undefined') {
      cockpitGroup.visible = (viewMode === 2);
    }

    if(viewMode===0){
      const off=fwd.clone().multiplyScalar(-26).add(up.clone().multiplyScalar(8));
      camera.position.lerp(player.position.clone().add(off),0.11);
      camera.lookAt(player.position.clone().add(fwd.clone().multiplyScalar(11)));
      camera.fov=62;
    } else if(viewMode===1){
      const off=fwd.clone().multiplyScalar(-46).add(up.clone().multiplyScalar(15));
      camera.position.lerp(player.position.clone().add(off),0.07);
      camera.lookAt(player.position.clone().add(fwd.clone().multiplyScalar(18)));
      camera.fov=62;
    } else {
      camera.position.copy(player.position)
        .add(fwd.clone().multiplyScalar(1.55))
        .add(up.clone().multiplyScalar(0.72));
      camera.lookAt(
        player.position.clone()
          .add(fwd.clone().multiplyScalar(35))
          .add(up.clone().multiplyScalar(0.15))
      );
      camera.fov = 70;
    }
    camera.updateProjectionMatrix();
  }

  let lastNet=0;
  function animate(now){
    requestAnimationFrame(animate);
    const dt=Math.min((now-lastTime)/1000,0.05);
    lastTime=now;
    if(gameRunning){
      updatePlayer(dt);
      if(mode==='solo') updateEnemies(dt);
      updateProjectiles(dt);
      updateParticles(dt);
      updateCamera();
      updateHud();
      drawRadar();
      if (viewMode === 2 && typeof drawMFDs === 'function') drawMFDs();
      if(mode==='multi' && now-lastNet>80){sendState(); lastNet=now}
    }
    renderer.render(scene,camera);
  }
  let lastTime=performance.now();
  animate(lastTime);

  document.getElementById('startBtn').onclick=()=>{
    callsign=document.getElementById('callsignInput').value.trim()||'Viper';
    roomCode=document.getElementById('roomInput').value.trim().toUpperCase()||'WAR1';
    mode=document.getElementById('modeSelect').value;
    myId = Math.random().toString(36).slice(2,10);
    initAudio(); if(audioCtx.state==='suspended') audioCtx.resume();

    playerHealth=100; missilesLeft=6; score=0; wave=0;
    player.position.set(-700, 22, 0);
    player.quaternion.identity();
    player.userData.vel.set(0, 0, 0);
    throttle = 0.4;
    onGround = true;
    lockedTarget = null;

    [...enemies].forEach(e=>scene.remove(e)); enemies.length=0;
    [...bullets].forEach(b=>scene.remove(b)); bullets.length=0;
    [...missiles].forEach(m=>scene.remove(m)); missiles.length=0;
    remotePlayers.forEach(r=>scene.remove(r.mesh)); remotePlayers.clear();

    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('gameOver').style.display='none';
    document.getElementById('hud').classList.add('visible');
    gameRunning=true;
    updateHud();

    if(mode==='multi'){
      document.getElementById('status').textContent='Connecting...';
      connectWS();
    } else {
      setTimeout(spawnWave,1200);
    }
  };

  document.getElementById('restartBtn').onclick=()=>{
    document.getElementById('gameOver').style.display='none';
    document.getElementById('startScreen').classList.remove('hidden');
    document.getElementById('hud').classList.remove('visible');
  };

  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
  </script>
